<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRIDPOINT — Bangalore Warehouse Optimization</title>
  <meta name="description" content="Interactive visualization of optimal warehouse placement across Bangalore using discrete facility location optimization." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark: #f0f2f5;
      --bg-panel: rgba(255, 255, 255, 0.92);
      --bg-glass: rgba(245, 247, 250, 0.85);
      --border-glass: rgba(0,0,0,0.08);
      --accent: #7c3aed;
      --accent-glow: rgba(124,58,237,0.25);
      --text-primary: #1a1a2e;
      --text-secondary: #4a5568;
      --text-muted: #718096;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 14px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      font-family: var(--font);
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    /* ---- Glass Panel (Left Control Panel) ---- */
    .control-panel {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 350px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: 20px;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.04) inset;
    }

    .control-panel::-webkit-scrollbar { width: 4px; }
    .control-panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

    .panel-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .panel-brand .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: white;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .panel-brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4c1d95, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .panel-brand .version {
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ---- Form Controls ---- */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .form-group input[type="number"],
    .form-group input[type="range"] {
      width: 100%;
      background: rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 9px 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: var(--font);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      background: rgba(0,0,0,0.08);
      border-radius: 3px;
      border: none;
      padding: 0;
    }

    .range-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      cursor: pointer;
    }

    .range-value {
      min-width: 28px;
      text-align: right;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    /* ---- Buttons ---- */
    .btn-optimize {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.25s;
      box-shadow: 0 4px 20px var(--accent-glow);
      margin-top: 6px;
    }

    .btn-optimize:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(124,58,237,0.5);
    }

    .btn-optimize:active { transform: translateY(0); }

    .btn-optimize:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-optimize .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Status Badge ---- */
    .status-bar {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(0,0,0,0.03);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .status-bar .highlight {
      color: var(--success);
      font-weight: 600;
    }

    .status-bar .cost {
      color: var(--warning);
      font-weight: 600;
    }

    /* ---- Right Panel: Cost, SLA & ESG Operations ---- */
    .cost-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 360px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: 18px 20px;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      display: none;
    }

    .cost-panel.visible { display: block; }

    .cost-panel::-webkit-scrollbar { width: 4px; }
    .cost-panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

    .cost-panel h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .cost-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--accent);
      margin: 14px 0 6px 0;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(124,58,237,0.15);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cost-section-title:first-child { margin-top: 0; }

    .cost-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .cost-row:last-child { border-bottom: none; }

    .cost-row .cost-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .cost-row .cost-value {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .cost-row.total {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 2px solid rgba(0,0,0,0.1);
    }

    .cost-row.total .cost-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .cost-row.total .cost-value {
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--success), #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ---- Fleet Power Toggle & ESG Controls ---- */
    .fleet-toggle-group {
      display: flex;
      gap: 6px;
      background: rgba(0,0,0,0.04);
      padding: 4px;
      border-radius: 9px;
      margin-bottom: 10px;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .fleet-toggle-btn {
      flex: 1;
      padding: 8px 6px;
      border: none;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font);
      text-align: center;
    }

    .fleet-toggle-btn.active {
      background: #7c3aed;
      color: white;
      box-shadow: 0 2px 10px rgba(124,58,237,0.35);
    }

    .fleet-toggle-btn.active.ev {
      background: #059669;
      box-shadow: 0 2px 10px rgba(5,150,105,0.35);
    }

    /* ---- 10-Minute SLA Compliance Card ---- */
    .sla-card {
      background: linear-gradient(135deg, rgba(124,58,237,0.07), rgba(59,130,246,0.04));
      border: 1px solid rgba(124,58,237,0.22);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(124,58,237,0.06);
    }

    .sla-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .sla-title {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #6d28d9;
    }

    .sla-target-tag {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(124,58,237,0.12);
      color: #6d28d9;
    }

    .sla-metric-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 8px;
    }

    .sla-main-metric {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .sla-pct-val {
      font-size: 27px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }

    .sla-pct-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .sla-time-box {
      text-align: right;
    }

    .sla-time-box .time-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .sla-time-box .time-val {
      font-size: 16px;
      font-weight: 800;
    }

    .sla-gauge-container {
      height: 9px;
      background: rgba(0,0,0,0.07);
      border-radius: 5px;
      overflow: hidden;
      margin: 8px 0;
      position: relative;
    }

    .sla-gauge-fill {
      height: 100%;
      border-radius: 5px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sla-breakdown-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-secondary);
      margin: 6px 0 8px 0;
      padding-top: 4px;
      border-top: 1px dashed rgba(0,0,0,0.08);
    }

    .sla-callout {
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.4;
      margin-top: 6px;
    }

    .sla-badge-danger {
      background: rgba(220,38,38,0.08);
      border: 1px solid rgba(220,38,38,0.25);
      color: #991b1b;
    }

    .sla-badge-warning {
      background: rgba(217,119,6,0.08);
      border: 1px solid rgba(217,119,6,0.25);
      color: #92400e;
    }

    .sla-badge-success {
      background: rgba(5,150,105,0.08);
      border: 1px solid rgba(5,150,105,0.25);
      color: #065f46;
    }

    /* ---- ESG Fleet Simulator Card ---- */
    .esg-card {
      background: linear-gradient(135deg, rgba(5,150,105,0.08), rgba(16,185,129,0.03));
      border: 1px solid rgba(5,150,105,0.22);
      border-radius: 12px;
      padding: 13px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(5,150,105,0.06);
    }

    .esg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .esg-title {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #047857;
    }

    .esg-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(5,150,105,0.14);
      color: #047857;
    }

    .esg-compare-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .esg-stat-box {
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(0,0,0,0.06);
      border-radius: 8px;
      padding: 7px 8px;
    }

    .esg-stat-box.highlight {
      background: rgba(5,150,105,0.07);
      border-color: rgba(5,150,105,0.25);
    }

    .esg-stat-box .stat-title {
      font-size: 9.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .esg-stat-box .stat-val {
      font-size: 13px;
      font-weight: 800;
    }

    .esg-stat-box .stat-val.petrol { color: #d97706; }
    .esg-stat-box .stat-val.ev { color: #059669; }

    .esg-stat-box .stat-sub {
      font-size: 9.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .esg-savings-banner {
      background: linear-gradient(135deg, rgba(5,150,105,0.12), rgba(16,185,129,0.08));
      border: 1px solid rgba(5,150,105,0.3);
      border-radius: 9px;
      padding: 9px;
      text-align: center;
      margin-bottom: 8px;
    }

    .esg-savings-banner .savings-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #047857;
    }

    .esg-savings-banner .savings-val {
      font-size: 19px;
      font-weight: 800;
      color: #047857;
      margin: 2px 0;
    }

    .esg-savings-banner .savings-sub {
      font-size: 9.5px;
      color: var(--text-secondary);
    }

    .esg-co2-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 10.5px;
      color: var(--text-secondary);
      padding: 5px 0;
      border-top: 1px dashed rgba(0,0,0,0.08);
      border-bottom: 1px dashed rgba(0,0,0,0.08);
      margin-bottom: 6px;
    }

    .esg-co2-row .co2-item {
      display: flex;
      justify-content: space-between;
    }

    .judge-note {
      font-size: 9.5px;
      color: var(--text-muted);
      line-height: 1.35;
      background: rgba(0,0,0,0.02);
      border-left: 2px solid #059669;
      padding: 5px 7px;
      border-radius: 0 6px 6px 0;
    }

    /* ---- Warehouse Legend (Bottom-Right) ---- */
    .warehouse-legend {
      position: fixed;
      bottom: 24px;
      right: 16px;
      width: 360px;
      max-height: 250px;
      overflow-y: auto;
      background: var(--bg-panel);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      padding: 14px 18px;
      z-index: 1000;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    }

    .warehouse-legend.visible { display: block; }
    .warehouse-legend::-webkit-scrollbar { width: 4px; }
    .warehouse-legend::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

    .warehouse-legend h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(0,0,0,0.3);
    }

    .legend-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .legend-orders {
      margin-left: auto;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* ---- Loading Overlay ---- */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .loading-overlay.visible { display: flex; }

    .loading-overlay .loader {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(0,0,0,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-overlay p {
      font-size: 14px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Leaflet light mode overrides */
    .leaflet-control-zoom a {
      background: var(--bg-panel) !important;
      color: var(--text-primary) !important;
      border-color: var(--border-glass) !important;
    }

    .leaflet-popup-content-wrapper {
      background: var(--bg-panel) !important;
      color: var(--text-primary) !important;
      border-radius: 10px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15) !important;
      backdrop-filter: blur(20px) !important;
    }

    .leaflet-popup-tip { background: var(--bg-panel) !important; }

    .leaflet-popup-content {
      font-family: var(--font) !important;
      font-size: 12px !important;
      line-height: 1.6 !important;
    }

    .leaflet-popup-content strong {
      color: #6d28d9;
    }
  </style>
</head>
<body>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loader"></div>
    <p id="loadingText">Initializing GRIDPOINT engine…</p>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- Left control panel -->
  <div class="control-panel" id="controlPanel">
    <div class="panel-brand">
      <div class="logo">G</div>
      <div>
        <h1>GRIDPOINT</h1>
        <div class="version">Discrete Spatial Optimizer v2.0</div>
      </div>
    </div>

    <div class="form-group">
      <label>Number of Warehouses (1 to 100)</label>
      <div class="range-row">
        <input type="range" id="numWarehouses" min="1" max="100" value="3" />
        <span class="range-value" id="numWarehousesVal">3</span>
      </div>
    </div>

    <div class="form-group">
      <label>Monthly Budget (₹ Lakhs) — 0 = Unlimited</label>
      <input type="number" id="budgetMonthly" value="0" min="0" step="5" placeholder="0 = unconstrained" />
    </div>

    <div class="form-group">
      <label>Property Size (sq.ft)</label>
      <input type="number" id="propertySize" value="2500" min="500" step="100" />
    </div>

    <div class="form-group">
      <label>Petrol Cost (₹/km)</label>
      <input type="number" id="petrolCost" value="2" min="0.5" step="0.5" />
    </div>

    <div class="form-group">
      <label>Deliveries per Trip (Batch)</label>
      <div class="range-row">
        <input type="range" id="batchSize" min="1" max="10" value="3" />
        <span class="range-value" id="batchSizeVal">3</span>
      </div>
    </div>

    <div class="form-group">
      <label>Min Hub Separation (km)</label>
      <input type="number" id="minDispersion" value="6.5" min="0" step="0.5" />
    </div>

    <!-- ESG / EV Fleet Simulator Controls -->
    <div class="cost-section-title" style="margin-top:14px;margin-bottom:8px">🌱 ESG Fleet Power Simulator</div>
    <div class="fleet-toggle-group">
      <button type="button" class="fleet-toggle-btn active" id="btnFleetPetrol" onclick="setFleetPower(0)">⛽ Petrol (₹2/km)</button>
      <button type="button" class="fleet-toggle-btn" id="btnFleetEV" onclick="setFleetPower(100)">⚡ 100% EV (₹0.35/km)</button>
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <label style="margin:0;font-size:10.5px">EV Fleet Transition</label>
        <span class="range-value" id="evFleetVal" style="color:var(--success);font-weight:700">0%</span>
      </div>
      <div class="range-row">
        <input type="range" id="evFleetPct" min="0" max="100" value="0" step="5" />
      </div>
    </div>

    <button class="btn-optimize" id="btnOptimize" onclick="runOptimization()">
      ⚡ Run Optimization
    </button>

    <div class="status-bar" id="statusBar">
      Ready. Load city data and run optimization.
    </div>
  </div>

  <!-- Right cost panel -->
  <div class="cost-panel" id="costPanel">
    <h2>📊 Network & Workforce Operations</h2>
    <div id="costRows"></div>
  </div>

  <!-- Legend -->
  <div class="warehouse-legend" id="warehouseLegend">
    <h3>🏭 Active Warehouses & Drivers</h3>
    <div id="legendItems"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API = "http://127.0.0.1:8000";

    // ---- Map Init ----
    const map = L.map("map", {
      center: [12.9716, 77.5946],
      zoom: 12,
      zoomControl: true
    });

    // Light tile layer (CartoDB Voyager with API key)
    L.tileLayer("https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_3qno_1_71275e10b239db3df0db0093", {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
      maxZoom: 19
    }).addTo(map);

    // Layer groups
    const demandLayer = L.layerGroup().addTo(map);
    const assignmentLayer = L.layerGroup().addTo(map);
    const warehouseLayer = L.layerGroup().addTo(map);

    // ---- State ----
    let cityData = null;
    let lastResult = null;

    // ---- Range Sliders ----
    document.getElementById("numWarehouses").addEventListener("input", (e) => {
      const p = parseInt(e.target.value);
      document.getElementById("numWarehousesVal").textContent = p;
      // Recommend optimal spatial separation for p hubs
      const dispInput = document.getElementById("minDispersion");
      if (p <= 4) dispInput.value = "6.5";
      else if (p <= 8) dispInput.value = "4.5";
      else if (p <= 15) dispInput.value = "3.0";
      else if (p <= 30) dispInput.value = "2.0";
      else if (p <= 60) dispInput.value = "1.2";
      else dispInput.value = "0.8";
    });
    document.getElementById("batchSize").addEventListener("input", (e) => {
      document.getElementById("batchSizeVal").textContent = e.target.value;
    });

    // ---- ESG Fleet Power Switch & Live Simulator ----
    function setFleetPower(pct) {
      document.getElementById("evFleetPct").value = pct;
      document.getElementById("evFleetVal").textContent = pct + "%";

      const btnP = document.getElementById("btnFleetPetrol");
      const btnEV = document.getElementById("btnFleetEV");
      if (pct === 0) {
        btnP.classList.add("active");
        btnEV.classList.remove("active", "ev");
      } else if (pct === 100) {
        btnP.classList.remove("active");
        btnEV.classList.add("active", "ev");
      } else {
        btnP.classList.remove("active");
        btnEV.classList.remove("active", "ev");
      }

      if (lastResult && lastResult.costs) {
        updateCostsLive(pct);
      }
    }

    document.getElementById("evFleetPct").addEventListener("input", (e) => {
      const pct = parseFloat(e.target.value);
      document.getElementById("evFleetVal").textContent = pct + "%";

      const btnP = document.getElementById("btnFleetPetrol");
      const btnEV = document.getElementById("btnFleetEV");
      if (pct === 0) {
        btnP.classList.add("active");
        btnEV.classList.remove("active", "ev");
      } else if (pct === 100) {
        btnP.classList.remove("active");
        btnEV.classList.add("active", "ev");
      } else {
        btnP.classList.remove("active");
        btnEV.classList.remove("active", "ev");
      }

      if (lastResult && lastResult.costs) {
        updateCostsLive(pct);
      }
    });

    function updateCostsLive(pct) {
      if (!lastResult || !lastResult.costs) return;
      const c = lastResult.costs;
      const evRatio = pct / 100.0;
      const petrolDaily = c.daily_petrol_cost || (c.daily_fleet_km * (c.petrol_running_cost_per_km || 2.0));
      const evDaily = c.daily_ev_cost || (c.daily_fleet_km * 0.35);

      c.ev_fleet_pct = pct;
      c.daily_petrol_cost = petrolDaily;
      c.daily_ev_cost = evDaily;
      c.daily_fuel_savings = (petrolDaily - evDaily) * evRatio;
      c.annual_fuel_savings = c.daily_fuel_savings * 365.0;
      c.daily_fuel = (petrolDaily * (1.0 - evRatio)) + (evDaily * evRatio);
      c.annual_fuel = c.daily_fuel * 365.0;

      // Baseline annual CO2 from total fleet km (0% EV)
      const baselineCo2Tons = (c.daily_fleet_km / 35.0 * 2.31 * 365.0) / 1000.0;
      c.annual_co2_saved_tons = baselineCo2Tons * evRatio;
      c.annual_co2_tons = baselineCo2Tons * (1.0 - evRatio);
      c.daily_fuel_liters = (c.daily_fleet_km / 35.0) * (1.0 - evRatio);

      renderCostPanel(c);
    }

    // ---- Helpers ----
    function formatINR(val) {
      if (val >= 1e7) return "₹" + (val / 1e7).toFixed(2) + " Cr";
      if (val >= 1e5) return "₹" + (val / 1e5).toFixed(2) + " L";
      return "₹" + val.toLocaleString("en-IN");
    }

    function formatNum(val) {
      return val.toLocaleString("en-IN", { maximumFractionDigits: 0 });
    }

    function hexToRGBA(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function showLoading(msg) {
      document.getElementById("loadingText").textContent = msg;
      document.getElementById("loadingOverlay").classList.add("visible");
    }

    function hideLoading() {
      document.getElementById("loadingOverlay").classList.remove("visible");
    }

    function setStatus(html) {
      document.getElementById("statusBar").innerHTML = html;
    }

    // ---- Load City Data ----
    async function loadCityData() {
      showLoading("Loading 800 Bangalore grid nodes…");
      try {
        const res = await fetch(`${API}/api/city`);
        cityData = await res.json();
        renderDemandHeatmap(cityData.points);
        setStatus(
          `<span class="highlight">✓ ${cityData.total_points} nodes loaded</span><br>` +
          `Total demand: <span class="cost">${formatNum(cityData.total_daily_orders)} orders/day</span>`
        );

        // Fit bounds
        const lats = cityData.points.map(p => p.latitude);
        const lngs = cityData.points.map(p => p.longitude);
        map.fitBounds([
          [Math.min(...lats) - 0.02, Math.min(...lngs) - 0.02],
          [Math.max(...lats) + 0.02, Math.max(...lngs) + 0.02]
        ]);
      } catch (err) {
        setStatus(`<span style="color:var(--danger)">✗ Failed to connect to backend: ${err.message}</span>`);
      } finally {
        hideLoading();
      }
    }

    // ---- Render Demand Heatmap ----
    function renderDemandHeatmap(points, assignmentMap = null) {
      demandLayer.clearLayers();

      // Compute max demand for scaling
      const maxDemand = Math.max(...points.map(p => p.orders_per_day));

      points.forEach(p => {
        const intensity = p.orders_per_day / maxDemand;
        let fillColor;
        let assignedInfo = "";

        if (assignmentMap && assignmentMap[p.point_id]) {
          // Colored by warehouse assignment
          fillColor = assignmentMap[p.point_id].color;
          assignedInfo = `<br><strong>Assigned to:</strong> ${assignmentMap[p.point_id].warehouse}` +
                         `<br><strong>Distance:</strong> ${assignmentMap[p.point_id].distance.toFixed(1)} km`;
        } else {
          // Suitability gradient: dark blue (low) → cyan → yellow → red (high)
          const h = (1 - intensity) * 240;
          fillColor = `hsl(${h}, 80%, 55%)`;
        }

        const radius = 3 + intensity * 6;

        const circle = L.circleMarker([p.latitude, p.longitude], {
          radius: radius,
          fillColor: fillColor,
          fillOpacity: assignmentMap ? 0.55 : 0.45,
          color: assignmentMap ? fillColor : "transparent",
          weight: assignmentMap ? 0.5 : 0,
          stroke: !!assignmentMap
        });

        circle.bindPopup(
          `<strong>${p.nearest_locality}</strong> (${p.zone})<br>` +
          `<strong>Orders:</strong> ${formatNum(p.orders_per_day)}/day<br>` +
          `<strong>Price:</strong> ₹${p.price_per_sqft.toFixed(0)}/sqft<br>` +
          `<strong>Traffic:</strong> ${p.traffic_index.toFixed(2)}<br>` +
          `<strong>Suitability:</strong> ${(p.suitability_score * 100).toFixed(1)}%` +
          assignedInfo,
          { maxWidth: 250 }
        );

        demandLayer.addLayer(circle);
      });
    }

    // ---- Run Optimization ----
    async function runOptimization() {
      const btn = document.getElementById("btnOptimize");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Optimizing…';

      const numWarehouses = parseInt(document.getElementById("numWarehouses").value);
      const budgetRaw = parseFloat(document.getElementById("budgetMonthly").value);
      const budget = budgetRaw > 0 ? budgetRaw * 100000 : null; // Convert lakhs to INR
      const propertySize = parseFloat(document.getElementById("propertySize").value);
      const petrolCost = parseFloat(document.getElementById("petrolCost").value);
      const batchSize = parseInt(document.getElementById("batchSize").value);
      const minDispersion = parseFloat(document.getElementById("minDispersion").value);
      const evFleetPct = parseFloat(document.getElementById("evFleetPct").value || 0);

      showLoading(`Running p-Median solver for ${numWarehouses} warehouse${numWarehouses > 1 ? 's' : ''}…`);

      try {
        const res = await fetch(`${API}/api/optimize`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            num_warehouses: numWarehouses,
            budget_monthly: budget,
            property_size_sqft: propertySize,
            petrol_cost_per_km: petrolCost,
            batch_size: batchSize,
            min_dispersion_km: minDispersion,
            ev_fleet_pct: evFleetPct,
            picking_time_min: 3.0,
            target_sla_minutes: 10.0
          })
        });

        lastResult = await res.json();

        if (lastResult.status !== "ok" && lastResult.status !== "optimal" && lastResult.status !== "feasible") {
          setStatus(
            `<span style="color:var(--danger)">✗ ${lastResult.status}</span><br>` +
            `${lastResult.reason || lastResult.message || "No feasible solution found."}`
          );
          hideLoading();
          btn.disabled = false;
          btn.innerHTML = "⚡ Run Optimization";
          return;
        }

        renderResults(lastResult);

        const sla = lastResult.costs.sla_compliance_pct;
        const slaColor = sla >= 85 ? 'var(--success)' : (sla >= 40 ? 'var(--warning)' : 'var(--danger)');

        setStatus(
          `<span class="highlight">✓ ${lastResult.status.toUpperCase()}</span> — ` +
          `<strong>${lastResult.warehouses.length}</strong> hubs placed<br>` +
          `⚡ <strong>10-Min SLA:</strong> <span style="font-weight:700;color:${slaColor}">${sla.toFixed(1)}%</span> (Avg: ${lastResult.costs.avg_delivery_time_min.toFixed(1)} min)<br>` +
          `🌱 <strong>EV Savings:</strong> <span style="color:var(--success);font-weight:700">${formatINR(lastResult.costs.annual_fuel_savings)}/yr</span> (${lastResult.costs.ev_fleet_pct.toFixed(0)}% EV)<br>` +
          `🏢 <strong>Facility Rent:</strong> ${formatINR(lastResult.costs.monthly_rent)}/mo · 👥 <strong>${formatNum(lastResult.costs.total_employees)}</strong> drivers`
        );

      } catch (err) {
        setStatus(`<span style="color:var(--danger)">✗ API Error: ${err.message}</span>`);
      } finally {
        hideLoading();
        btn.disabled = false;
        btn.innerHTML = "⚡ Run Optimization";
      }
    }

    // ---- Render Optimization Results ----
    function renderResults(result) {
      // Clear previous
      warehouseLayer.clearLayers();
      assignmentLayer.clearLayers();

      const numWh = result.warehouses.length;

      // Build assignment lookup: demand_id → { warehouse, color, distance }
      const warehouseMap = {};
      result.warehouses.forEach(w => { warehouseMap[w.id] = w; });

      const assignmentMap = {};
      result.assignments.forEach(a => {
        const wh = warehouseMap[a.warehouse_id];
        if (wh) {
          assignmentMap[a.demand_id] = {
            warehouse: wh.name,
            color: wh.color,
            distance: a.distance_km
          };
        }
      });

      // Re-render demand with assignment coloring
      if (cityData) {
        renderDemandHeatmap(cityData.points, assignmentMap);
      }

      // Draw assignment spokes (lines from demand node → warehouse)
      if (cityData) {
        const pointMap = {};
        cityData.points.forEach(p => { pointMap[p.point_id] = p; });

        const spokeOpacity = numWh > 30 ? 0.12 : (numWh > 10 ? 0.20 : 0.25);
        result.assignments.forEach(a => {
          const dp = pointMap[a.demand_id];
          const wh = warehouseMap[a.warehouse_id];
          if (dp && wh) {
            const line = L.polyline(
              [[dp.latitude, dp.longitude], [wh.lat, wh.lng]],
              {
                color: hexToRGBA(wh.color, spokeOpacity),
                weight: 1,
                dashArray: "4 6",
                interactive: false
              }
            );
            assignmentLayer.addLayer(line);
          }
        });
      }

      // Draw warehouse markers
      const markerRadius = numWh > 50 ? 7 : (numWh > 20 ? 10 : 13);

      result.warehouses.forEach((w, i) => {
        // Warehouse marker circle
        const warehouseCircle = L.circleMarker([w.lat, w.lng], {
          radius: markerRadius,
          fillColor: w.color,
          fillOpacity: 0.92,
          color: "#ffffff",
          weight: 2.5,
          opacity: 0.95
        });

        warehouseCircle.bindPopup(
          `<div style="min-width:240px">` +
          `<strong style="font-size:14px;color:${w.color}">W${i + 1}: ${w.name}</strong><br>` +
          `<span style="color:var(--text-muted);font-size:11px">${w.locality} · ${w.zone}</span>` +
          `<hr style="border:0;border-top:1px solid rgba(0,0,0,0.1);margin:8px 0">` +
          `<div style="display:flex;justify-content:space-between;margin-bottom:4px;background:rgba(124,58,237,0.06);padding:3px 6px;border-radius:6px">` +
          `<span>⚡ <strong>10-Min SLA:</strong></span>` +
          `<span style="font-weight:700;color:${w.sla_compliance_pct >= 85 ? 'var(--success)' : (w.sla_compliance_pct >= 40 ? 'var(--warning)' : 'var(--danger)')}">${w.sla_compliance_pct.toFixed(1)}%</span>` +
          `</div>` +
          `<div style="display:flex;justify-content:space-between;margin-bottom:4px">` +
          `<span>⏱️ <strong>Avg Delivery Time:</strong></span>` +
          `<span style="font-weight:600">${w.avg_delivery_time_min.toFixed(1)} min</span>` +
          `</div>` +
          `<div style="display:flex;justify-content:space-between;margin-bottom:3px">` +
          `<span>👥 <strong>Delivery Workforce:</strong></span>` +
          `<span style="font-weight:700;color:var(--accent)">${formatNum(w.employees_required)} drivers</span>` +
          `</div>` +
          `<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">Salary: ₹1,000/day (${formatINR(w.daily_salary)}/d · ${formatINR(w.monthly_salary)}/mo)</div>` +
          `<div style="display:flex;justify-content:space-between;margin-bottom:3px">` +
          `<span>🏢 <strong>Facility Rent:</strong></span>` +
          `<span>${formatINR(w.monthly_rent)}/mo</span>` +
          `</div>` +
          `<div style="display:flex;justify-content:space-between;margin-bottom:3px">` +
          `<span>📦 <strong>Daily Orders:</strong></span>` +
          `<span>${formatNum(w.assigned_orders)}</span>` +
          `</div>` +
          `<div style="display:flex;justify-content:space-between;margin-bottom:3px">` +
          `<span>⚡ <strong>Capacity Util:</strong></span>` +
          `<span>${w.utilization_pct.toFixed(1)}%</span>` +
          `</div>` +
          `<div style="display:flex;justify-content:space-between;margin-bottom:3px">` +
          `<span>🏷️ <strong>Real Estate Rate:</strong></span>` +
          `<span>₹${w.price_per_sqft.toFixed(0)}/sqft</span>` +
          `</div>` +
          `<div style="display:flex;justify-content:space-between">` +
          `<span>⭐ <strong>Suitability:</strong></span>` +
          `<span>${(w.suitability_score * 100).toFixed(1)}%</span>` +
          `</div>` +
          `</div>`,
          { maxWidth: 290 }
        );

        warehouseLayer.addLayer(warehouseCircle);

        // Outer glow ring
        if (numWh <= 40) {
          const glowRing = L.circleMarker([w.lat, w.lng], {
            radius: markerRadius + 8,
            fillColor: w.color,
            fillOpacity: 0.15,
            color: w.color,
            weight: 1.5,
            opacity: 0.3,
            interactive: false
          });
          warehouseLayer.addLayer(glowRing);
        }

        // Label (only when p <= 25 to prevent clutter)
        if (numWh <= 25) {
          const label = L.divIcon({
            className: "",
            html: `<div style="
              font-family: Inter, sans-serif;
              font-size: 10px;
              font-weight: 700;
              color: #1a1a2e;
              text-align: center;
              text-shadow: 0 1px 3px rgba(255,255,255,0.9);
              white-space: nowrap;
              pointer-events: none;
              position: relative;
              top: 18px;
            ">W${i + 1}: ${w.name} (${formatNum(w.employees_required)}👥 · ${w.avg_delivery_time_min}m)</div>`,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });
          warehouseLayer.addLayer(L.marker([w.lat, w.lng], { icon: label, interactive: false }));
        }
      });

      // Update cost panel
      renderCostPanel(result.costs);

      // Update legend
      renderLegend(result.warehouses);
    }

    // ---- Cost, SLA & ESG Panel ----
    function renderCostPanel(costs) {
      const panel = document.getElementById("costPanel");
      const rows = document.getElementById("costRows");

      const sla = costs.sla_compliance_pct !== undefined ? costs.sla_compliance_pct : 0.0;
      const avgTime = costs.avg_delivery_time_min !== undefined ? costs.avg_delivery_time_min : 0.0;
      const transitTime = Math.max(0, avgTime - 3.0);

      let slaBadgeClass = "sla-badge-danger";
      let slaBadgeIcon = "⚠️";
      let slaBadgeTitle = "10-Min Delivery Physically Impossible!";
      let slaBadgeDesc = `With few warehouses, customers are 10–15 km away (avg delivery: ${avgTime.toFixed(1)} min). 10-minute quick-commerce requires 50–100 micro-hubs!`;
      let slaGaugeColor = "linear-gradient(90deg, #ef4444, #f97316)";

      if (sla >= 85) {
        slaBadgeClass = "sla-badge-success";
        slaBadgeIcon = "🎯";
        slaBadgeTitle = "10-Min Dark Store SLA Achieved!";
        slaBadgeDesc = `${sla.toFixed(1)}% of orders delivered in <10 min (avg: ${avgTime.toFixed(1)} min). Blinkit / Zepto micro-hub strategy proven!`;
        slaGaugeColor = "linear-gradient(90deg, #10b981, #059669)";
      } else if (sla >= 40) {
        slaBadgeClass = "sla-badge-warning";
        slaBadgeIcon = "⚡";
        slaBadgeTitle = "Moderate Coverage (Partial Compliance)";
        slaBadgeDesc = `${sla.toFixed(1)}% delivered under 10 min. Outer city nodes still face delays (avg: ${avgTime.toFixed(1)} min).`;
        slaGaugeColor = "linear-gradient(90deg, #f59e0b, #10b981)";
      }

      // ESG EV transition metrics
      const evPct = costs.ev_fleet_pct !== undefined ? costs.ev_fleet_pct : 0;
      const petrolDaily = costs.daily_petrol_cost !== undefined ? costs.daily_petrol_cost : costs.daily_fuel;
      const evDaily = costs.daily_ev_cost !== undefined ? costs.daily_ev_cost : (costs.daily_fleet_km * 0.35);
      const annualSavings = costs.annual_fuel_savings !== undefined ? costs.annual_fuel_savings : 0;
      const co2Avoided = costs.annual_co2_saved_tons !== undefined ? costs.annual_co2_saved_tons : 0;

      rows.innerHTML = `
        <!-- Feature 1: 10-Minute Quick-Commerce SLA Compliance Metric -->
        <div class="sla-card">
          <div class="sla-header">
            <div class="sla-title">⚡ 10-Min Quick-Commerce SLA</div>
            <div class="sla-target-tag">Target: ≤ 10 min</div>
          </div>

          <div class="sla-metric-row">
            <div class="sla-main-metric">
              <span class="sla-pct-val" style="color:${sla >= 85 ? 'var(--success)' : (sla >= 40 ? 'var(--warning)' : 'var(--danger)')}">
                ${sla.toFixed(1)}%
              </span>
              <span class="sla-pct-sub">under 10 min</span>
            </div>
            <div class="sla-time-box">
              <div class="time-label">Avg Delivery Time</div>
              <div class="time-val" style="color:${avgTime <= 10 ? 'var(--success)' : 'var(--danger)'}">
                ${avgTime.toFixed(1)} min
              </div>
            </div>
          </div>

          <!-- Progress Gauge -->
          <div class="sla-gauge-container">
            <div class="sla-gauge-fill" style="width:${Math.min(100, Math.max(5, sla))}%; background:${slaGaugeColor}"></div>
          </div>

          <div class="sla-breakdown-row">
            <span>⏱️ Hub Picking: <strong>3.0 min</strong></span>
            <span>🛵 Traffic Transit: <strong>${transitTime.toFixed(1)} min</strong></span>
          </div>

          <div class="sla-callout ${slaBadgeClass}">
            <strong>${slaBadgeIcon} ${slaBadgeTitle}</strong><br>
            <span>${slaBadgeDesc}</span>
          </div>
        </div>

        <!-- Feature 2: EV Transition and Fleet Green Savings Simulator (ESG Pitch) -->
        <div class="esg-card">
          <div class="esg-header">
            <div class="esg-title">🌱 EV Transition & Fleet Green Savings (ESG)</div>
            <span class="esg-badge">${evPct.toFixed(0)}% EV Fleet</span>
          </div>

          <div class="esg-compare-grid">
            <div class="esg-stat-box">
              <div class="stat-title">Petrol Fuel Expense</div>
              <div class="stat-val petrol">${formatINR(petrolDaily)}/day</div>
              <div class="stat-sub">₹2.00 / km rate</div>
            </div>
            <div class="esg-stat-box highlight">
              <div class="stat-title">EV Charging Cost</div>
              <div class="stat-val ev">${formatINR(evDaily)}/day</div>
              <div class="stat-sub" style="color:var(--success)">₹0.35/km (82% cheaper)</div>
            </div>
          </div>

          <div class="esg-savings-banner">
            <div class="savings-label">💰 Net Annual Fuel Savings</div>
            <div class="savings-val">${formatINR(annualSavings)} / year</div>
            <div class="savings-sub">For ${formatNum(costs.total_employees)} drivers traveling ${formatNum(costs.daily_fleet_km)} km/day</div>
          </div>

          <div class="esg-co2-row">
            <div class="co2-item">
              <span class="co2-label">Tailpipe CO₂ Eliminated:</span>
              <span class="co2-val" style="color:var(--success);font-weight:700">
                ${co2Avoided > 0 ? `${formatNum(co2Avoided)} Tons/yr avoided (100%)` : '0 Tons (0% EV)'}
              </span>
            </div>
            <div class="co2-item">
              <span class="co2-label">Remaining Emissions:</span>
              <span class="co2-val">${formatNum(costs.annual_co2_tons)} Tons CO₂/yr</span>
            </div>
          </div>

          <div class="judge-note">
            <strong>💡 Hackathon ESG Pitch:</strong> Transitioning the 52,000 two-wheeler fleet saves <strong>₹48+ Crore annually</strong> and eliminates <strong>20,000+ Tons of CO₂</strong> emissions.
          </div>
        </div>

        <!-- Facility Rent -->
        <div class="cost-section-title">🏢 Facility Rent (Company Budget)</div>
        <div class="cost-row">
          <span class="cost-label">Monthly Facility Rent</span>
          <span class="cost-value">${formatINR(costs.monthly_rent)}</span>
        </div>
        <div class="cost-row">
          <span class="cost-label">Annual Facility Rent</span>
          <span class="cost-value">${formatINR(costs.annual_rent)}</span>
        </div>
        ${costs.budget_used_pct !== null && costs.budget_used_pct !== undefined ? `
        <div class="cost-row">
          <span class="cost-label">Budget Utilization</span>
          <span class="cost-value" style="color:${costs.budget_used_pct > 90 ? 'var(--danger)' : 'var(--success)'}">${costs.budget_used_pct.toFixed(1)}%</span>
        </div>` : ''}

        <!-- Delivery Workforce -->
        <div class="cost-section-title">👥 Delivery Workforce (23 Orders/d)</div>
        <div class="cost-row">
          <span class="cost-label">Total Delivery Drivers</span>
          <span class="cost-value" style="color:var(--accent);font-weight:700">${formatNum(costs.total_employees)} drivers</span>
        </div>
        <div class="cost-row">
          <span class="cost-label">Driver Daily Wage</span>
          <span class="cost-value">₹1,000 / day</span>
        </div>
        <div class="cost-row">
          <span class="cost-label">Daily Driver Wages</span>
          <span class="cost-value">${formatINR(costs.daily_driver_wages)}</span>
        </div>
        <div class="cost-row">
          <span class="cost-label">Monthly Driver Payroll</span>
          <span class="cost-value">${formatINR(costs.monthly_driver_wages)}</span>
        </div>
        <div class="cost-row">
          <span class="cost-label">Avg Route / Driver</span>
          <span class="cost-value">${costs.avg_km_per_driver.toFixed(1)} km/day</span>
        </div>

        <div class="cost-row total">
          <span class="cost-label">Total Facility Budget</span>
          <span class="cost-value">${formatINR(costs.total_annual)}/yr</span>
        </div>
        <div class="cost-row" style="padding-top:4px;border:none">
          <span class="cost-label" style="font-size:11px;color:var(--text-muted)">Annual Driver Payroll</span>
          <span class="cost-value" style="font-size:11.5px;color:var(--text-muted)">${formatINR(costs.daily_driver_wages * 365)}/yr</span>
        </div>
      `;

      panel.classList.add("visible");
    }

    // ---- Legend ----
    function renderLegend(warehouses) {
      const legend = document.getElementById("warehouseLegend");
      const items = document.getElementById("legendItems");

      items.innerHTML = warehouses.map((w, i) => `
        <div class="legend-item">
          <div class="legend-dot" style="background:${w.color}"></div>
          <span class="legend-label" title="${w.name}">W${i + 1}: ${w.name}</span>
          <span class="legend-orders">⚡${w.sla_compliance_pct.toFixed(0)}% · 👥${formatNum(w.employees_required)}</span>
        </div>
      `).join("");

      legend.classList.add("visible");
    }

    // ---- Boot ----
    loadCityData();
  </script>
</body>
</html>
